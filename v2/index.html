<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BALIAN - Portfolio</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/effects.css">
  <style>
    .portfolio-statement {
      padding: 4rem 3rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .portfolio-statement__label {
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0.35;
      margin-bottom: 2.5rem;
      font-weight: 500;
    }

    .portfolio-statement__text {
      font-size: clamp(1.5rem, 3.5vw, 2.5rem);
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: -0.01em;
      text-align: left;
      max-width: 1000px;
    }

    @media (max-width: 900px) {
      .portfolio-statement {
        padding: 3rem 1.5rem 1.5rem;
      }
    }
  </style>
</head>
<body class="has-custom-cursor">

  <div class="custom-cursor"></div>
  <div class="custom-cursor__dot"></div>

  <nav class="nav">
    <a href="hero.html" class="nav__logo">Balian</a>
    <button class="nav__toggle" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <ul class="nav__links">
      <li><a href="index.html" class="active">Portfolio</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" class="nav__start">Start</a></li>
    </ul>
  </nav>

  <div class="page-spacer"></div>

  <section class="portfolio-statement">
    <div class="portfolio-statement__label" data-reveal>Portfolio</div>
    <p class="portfolio-statement__text" data-reveal data-reveal-delay="200">Based between Geneva and Paris, we serve a selective roster of clients in <span data-rotator="hospitality.|wellness.|luxury retail.|professional services." class="rotator--highlight">hospitality.</span></p>
  </section>


  <section class="section" style="padding-top: 1rem;">
    <div class="portfolio-grid">
      <a href="project-hexagon.html" class="portfolio-card" data-reveal data-reveal-delay="0">
        <img src="img/hexagon-padel/2.png" alt="Hexagon Paddle" class="portfolio-card__image">
        <div class="portfolio-card__overlay">
          <div class="portfolio-card__category">Brand Identity</div>
          <div class="portfolio-card__title">Hexagon Paddle</div>
        </div>
      </a>
      <a href="project-oria.html" class="portfolio-card" data-reveal data-reveal-delay="150">
        <img src="img/oria-terranea/cover.jpg" alt="Oria Terranea" class="portfolio-card__image">
        <div class="portfolio-card__overlay">
          <div class="portfolio-card__category">Visual Identity</div>
          <div class="portfolio-card__title">Oria Terranea</div>
        </div>
      </a>
    </div>
  </section>

  <footer class="footer">
    <p>&copy; 2026 Balian. All rights reserved.</p>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/effects.js"></script>
</body>
</html>
