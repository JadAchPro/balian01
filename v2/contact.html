<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BALIAN - Start</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/effects.css">
  <style>
    .start-header {
      padding: 6rem 3rem 5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .start-header__title {
      font-size: clamp(2rem, 4.5vw, 3.5rem);
      font-weight: 500;
      line-height: 1.25;
      letter-spacing: -0.01em;
      text-align: left;
      max-width: 900px;
      margin-bottom: 1.5rem;
    }

    .start-header__subtitle {
      font-size: 0.85rem;
      opacity: 0.5;
      letter-spacing: 0.1em;
    }

    @media (max-width: 900px) {
      .start-header { padding: 4rem 1.5rem 3rem; }
    }
  </style>
</head>
<body class="has-custom-cursor">

  <div class="custom-cursor"></div>
  <div class="custom-cursor__dot"></div>

  <nav class="nav">
    <a href="hero.html" class="nav__logo">Balian</a>
    <button class="nav__toggle" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <ul class="nav__links">
      <li><a href="index.html">Portfolio</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" class="nav__start active">Start</a></li>
    </ul>
  </nav>

  <div class="page-spacer"></div>

  <section class="start-header">
    <h1 class="start-header__title" data-reveal>Start a Project</h1>
    <p class="start-header__subtitle" data-reveal data-reveal-delay="200">Let's discuss your next move.</p>
  </section>

  <div class="animated-line" style="max-width: 1200px; margin: 0 auto;"></div>

  <section class="section">
    <div class="contact-grid">
      <div class="contact-info">
        <div class="contact-info__item" data-reveal data-reveal-delay="0">
          <span>Email</span>
          hello@balian.agency
        </div>
        <div class="contact-info__item" data-reveal data-reveal-delay="150">
          <span>Phone</span>
          +41 XX XXX XX XX
        </div>
        <div class="contact-info__item" data-reveal data-reveal-delay="300">
          <span>Location</span>
          Geneva, Switzerland
        </div>
      </div>

      <div class="calendly-embed" data-reveal data-reveal-delay="200">
        <span>Calendly Embed</span>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>&copy; 2026 Balian. All rights reserved.</p>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/effects.js"></script>
