<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BALIAN</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/effects.css">
</head>
<body class="has-custom-cursor">

  <div class="custom-cursor"></div>
  <div class="custom-cursor__dot"></div>

  <style>
    .hero__brand {
      position: absolute;
      top: 1.2rem;
      left: 3rem;
      z-index: 3;
      color: var(--white);
    }
    .hero__brand-name {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: var(--ls-title);
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }
    .hero__brand-location {
      font-size: 0.55rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0.5;
    }
    .hero__enter--center {
      position: absolute;
      bottom: 25vh;
      left: 0;
      right: 0;
      width: fit-content;
      margin: 0 auto;
      z-index: 3;
    }
    body.fade-out {
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    @media (max-width: 900px) {
      .hero__brand { top: 1rem; left: 1.5rem; }
    }
  </style>

  <section class="hero gradient-animate noise-bg">
    <div class="hero__slides">
      <div class="hero__slide active" style="background-image: url('../img/hero-1.png');"></div>
      <div class="hero__slide hero__slide--placeholder"></div>
      <div class="hero__slide hero__slide--placeholder"></div>
      <div class="hero__slide hero__slide--placeholder"></div>
      <div class="hero__slide hero__slide--placeholder"></div>
      <div class="hero__slide hero__slide--placeholder"></div>
    </div>
    <div class="hero__overlay"></div>

    <div class="hero__brand" data-reveal>
      <div class="hero__brand-name">Balian</div>
      <div class="hero__brand-location">Geneva &nbsp;| &nbsp;Paris</div>
    </div>

    <a href="index.html" class="hero__enter hero__enter--center" data-reveal data-reveal-delay="400">Enter</a>
  </section>

  <script src="../js/main.js"></script>
  <script src="../js/effects.js"></script>
  <script>
    document.querySelector('.hero__enter').addEventListener('click', function(e) {
      e.preventDefault();
      var href = this.href;
      document.body.classList.add('fade-out');
      setTimeout(function() { window.location.href = href; }, 400);
    });
  </script>
</body>
</html>
